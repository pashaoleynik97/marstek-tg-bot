version: "3.9"

services:
  marstek-venus-bot:
    build: .
    container_name: marstek-venus-bot
    volumes:
      - ./config.yml:/config.yml:ro
      - ./data:/app/data
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx256m"
    network_mode: host   # LAN access to Marstek (UDP) + inverter dongle connects back to TCP 8899